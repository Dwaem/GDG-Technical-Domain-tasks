<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitPrep: Space-Themed Placement Odyssey</title>
    
    <!-- React 18 & Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles for Sci-Fi Theme -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            background-color: #020617; /* slate-950 */
            color: #cffafe; /* cyan-100 */
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .neon-border-cyan {
            border: 1px solid #06b6d4;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }
        .neon-border-indigo {
            border: 1px solid #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4), inset 0 0 10px rgba(99, 102, 241, 0.1);
        }
        .neon-border-red {
            border: 1px solid #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4), inset 0 0 10px rgba(239, 68, 68, 0.1);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8);
        }
        .neon-text-red {
            color: #fca5a5;
            text-shadow: 0 0 8px rgba(248, 113, 113, 0.8);
        }
        .neon-text-green {
            color: #86efac;
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.8);
        }

        .scanline {
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(6,182,212,0.1) 50%, rgba(0,0,0,0) 100%);
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 10px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.1); }
            50% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.8), inset 0 0 20px rgba(6, 182, 212, 0.3); }
        }
        
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4), inset 0 0 10px rgba(239, 68, 68, 0.1); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.8), inset 0 0 20px rgba(239, 68, 68, 0.3); }
        }

        .sector-card:hover {
            animation: pulse-border 2s infinite;
            background-color: rgba(30, 58, 138, 0.3);
            transform: translateY(-2px);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .boss-card:hover {
            animation: pulse-red 2s infinite;
            background-color: rgba(127, 29, 29, 0.3);
            transform: translateY(-2px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .hud-grid {
            background-image: linear-gradient(rgba(6, 182, 212, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(6, 182, 212, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            opacity: 0.3;
        }
        
        /* Custom Scrollbar for Boss Modal */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #06b6d4; 
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Inline SVGs) ---
        const ShieldIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
        const ZapIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
        const StarIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
        const ClockIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
        const CheckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const CrosshairIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>;
        const SkullIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><path d="M8 20v2h8v-2"></path><path d="m12.5 17-.5-1-.5 1h1z"></path><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"></path></svg>;

        // --- Data Arrays ---
        const MISSIONS = [
            {
                id: "CH-01",
                sector: "Quant Nebula",
                title: "Velocity Vector Anomaly",
                question: "A star cruiser travels from Alpha Station to Beta Station at 40 ly/hr and returns along the same route at 60 ly/hr. What is the average speed for the entire round trip?",
                options: ["48 ly/hr", "50 ly/hr", "52 ly/hr", "55 ly/hr"],
                correctIndex: 0,
                stardustReward: 50,
                diagnosticLeak: "Sensors detect a basic arithmetic leak! You calculated the simple average of speeds instead of accounting for the varied time spent at each velocity.",
                repairTip: "For equal distances, always calculate average speed using the formula: 2xy / (x + y)."
            },
            {
                id: "CH-02",
                sector: "Quant Nebula",
                title: "Reactor Ring Calibration",
                question: "How many distinct ways can 5 differently colored energy crystals be arranged in a circular reactor ring to stabilize the warp core?",
                options: ["120", "24", "60", "256"],
                correctIndex: 1,
                stardustReward: 50,
                diagnosticLeak: "Navigation array misaligned! Linear permutation rules were applied instead of accounting for the lack of a fixed starting point in a circular orbit.",
                repairTip: "For circular arrangements of n distinct items without a fixed reference point, use (n - 1)! to find total combinations."
            },
            {
                id: "CH-03",
                sector: "DSA Deep Space",
                title: "The Missing Node",
                question: "Given a continuous data stream array from 1 to N with exactly one missing packet (e.g., [1, 2, 4, 5]), which algorithm finds the missing node most optimally in O(N) time with O(1) space?",
                options: ["Bubble Sort and Check", "HashSet Lookup", "Gauss's Summation Formula", "Two-Pointer Traversal"],
                correctIndex: 2,
                stardustReward: 50,
                diagnosticLeak: "Memory leak imminent! Utilizing extra space sets or O(N^2) sorting algorithms exhausts the ship's computational resources unnecessarily.",
                repairTip: "Subtract the actual sum of the array from the expected mathematical sum of n(n+1)/2 to isolate the missing element instantly."
            },
            {
                id: "CH-04",
                sector: "DSA Deep Space",
                title: "Bisection Overflow",
                question: "When calculating the midpoint to binary search a massive sorted databank, which formula safely prevents integer overflow errors?",
                options: ["mid = (low + high) / 2", "mid = (high - low) / 2", "mid = low + (high - low) / 2", "mid = low * high / 2"],
                correctIndex: 2,
                stardustReward: 50,
                diagnosticLeak: "Buffer overflow detected in the matrix! Adding two massive 32-bit indices directly causes integer bounds to rupture and crash the search protocol.",
                repairTip: "Always use `low + (high - low) / 2` to safely calculate the midpoint without triggering maximum integer limits."
            },
            {
                id: "CH-05",
                sector: "Core CS Void",
                title: "Quantum Transaction Failure",
                question: "A warp engine fuel transaction fails midway due to a solar flare. Which database property guarantees the system rolls back to its original state rather than leaving corrupted, partial data?",
                options: ["Atomicity", "Consistency", "Isolation", "Durability"],
                correctIndex: 0,
                stardustReward: 50,
                diagnosticLeak: "Data corruption anomaly! You confused the guarantee of an 'all-or-nothing' execution phase with the long-term survival of data after saving.",
                repairTip: "Remember Atomicity as 'All or Nothing'—if a transaction breaks at any point, it aborts and rolls back entirely."
            },
            {
                id: "CH-06",
                sector: "Core CS Void",
                title: "System Gridlock",
                question: "Two AI threads are locked, each holding a resource the other needs. Which of the Coffman conditions is NOT a valid prerequisite for a deadlock?",
                options: ["Mutual Exclusion", "Hold and Wait", "Preemption", "Circular Wait"],
                correctIndex: 2,
                stardustReward: 50,
                diagnosticLeak: "System freeze protocol triggered! True deadlocks require *No* Preemption, meaning resources cannot be forcibly seized by the operating system.",
                repairTip: "Deadlocks require four exact pillars: Mutual Exclusion, Hold & Wait, NO Preemption, and Circular Wait."
            },
            {
                id: "CH-07",
                sector: "HR Orbit",
                title: "Chain of Command Conflict",
                question: "A senior co-pilot disagrees with your calculated flight path during a critical mission, despite your data proving it is optimal. How do you resolve this?",
                options: ["Override their manual controls to save the ship.", "Publicly challenge their logic over the global comms.", "Present data-backed telemetry privately to find consensus.", "Comply silently to maintain the chain of command."],
                correctIndex: 2,
                stardustReward: 50,
                diagnosticLeak: "Diplomatic failure! Escalating aggressively or surrendering your logic compromises both crew morale and the ultimate success of the mission.",
                repairTip: "Address conflicts objectively using data in a private setting, ensuring mutual respect while solving the root problem."
            },
            {
                id: "CH-08",
                sector: "HR Orbit",
                title: "The Admiral's Pitch",
                question: "The Fleet Admiral asks: 'Why should we recruit you over other cadets?' What is the most effective strategic response?",
                options: ["State confidently that you are the smartest cadet in your class.", "Align your specific engineering skills with the fleet's current technical challenges.", "Explain that you need the credits urgently to support your home colony.", "Summarize your entire life story and passion for space from childhood."],
                correctIndex: 1,
                stardustReward: 50,
                diagnosticLeak: "Signal lost in the noise! Focusing solely on generic praise or irrelevant personal history fails to demonstrate your tangible value to the fleet's objectives.",
                repairTip: "Map your unique skills and past projects directly to the company's stated pain points and future goals."
            }
        ];

        const BOSS_RAIDS = [
            {
                id: "B-01",
                bossName: "The Mass-Fleet Mothership (NQT Class)",
                clearanceLevel: "Cadet",
                bossHp: 300,
                timeLimitSeconds: 240,
                phaseRounds: [
                    { roundName: "Phase 1: Cognitive Firewall", description: "Speed-based Quants & Verbal logic. High-volume, low-complexity incoming data streams." },
                    { roundName: "Phase 2: Syntax Swarm", description: "Rapid-fire pseudo-code interpretation and basic C/C++/Java output prediction." },
                    { roundName: "Phase 3: Core Algorithm Patch", description: "Standard array and string manipulation to stabilize the Mothership's basic thrusters." }
                ],
                debriefSuccess: "Telemetry confirmed. You have successfully bypassed the Mass-Fleet's entry filters and secured your place in the planetary armada.",
                debriefFailure: "Overwhelmed by the swarm. Your processing speed was insufficient for the Mass-Fleet's volume requirements. Upgrade your base computational speed and retry."
            },
            {
                id: "B-02",
                bossName: "The FinTech Dreadnought (GS/MS Class)",
                clearanceLevel: "Commander",
                bossHp: 500,
                timeLimitSeconds: 480,
                phaseRounds: [
                    { roundName: "Phase 1: Quant-Math Matrix", description: "Advanced Probability, Combinatorics, and Linear Algebra matrices to unlock the vault." },
                    { roundName: "Phase 2: Memory Leak Anomaly", description: "Deep dive into OS Deadlocks, Semaphore synchronization, and complex Pointer arithmetic." },
                    { roundName: "Phase 3: High-Frequency Asteroid Barrage", description: "Hard DSA utilizing Dynamic Programming and Graph traversals optimized for minimum latency." }
                ],
                debriefSuccess: "Dreadnought breached. You have proven exceptional analytical fortitude and memory management. The financial trade sectors are yours.",
                debriefFailure: "Critical system crash. The Dreadnought's mathematical matrix and memory constraints exposed inefficiencies in your logic core. Recalibrate your DP and OS fundamentals."
            },
            {
                id: "B-03",
                bossName: "The Big-Tech Orbital Platform (AMZN/FLPK Class)",
                clearanceLevel: "Fleet Admiral",
                bossHp: 750,
                timeLimitSeconds: 600,
                phaseRounds: [
                    { roundName: "Phase 1: Data Structure Orbital Rings", description: "Medium-Hard DSA anomalies requiring advanced Trees, Hash Maps, and Heaps to realign." },
                    { roundName: "Phase 2: Edge-Case Solar Flares", description: "Hard algorithmic bottlenecks focusing on Sliding Windows and boundary condition stress tests." },
                    { roundName: "Phase 3: System Architecture Core", description: "Low-Level Design (LLD) simulation. Constructing scalable, Object-Oriented blueprints for the platform's new comms array." }
                ],
                debriefSuccess: "Orbital Platform secured. Your structural architecture and algorithmic efficiency meet the highest galactic standards. Welcome to the Big-Tech upper echelon.",
                debriefFailure: "Structural integrity compromised. Your designs failed to scale under Big-Tech pressure and edge-case anomalies. Reinforce your Low-Level Design modules and Time Complexity optimization."
            }
        ];

        // --- Main App Component ---
        const App = () => {
            // Player Stats
            const [hullHP, setHullHP] = useState(100);
            const [streak, setStreak] = useState(14);
            const [stardust, setStardust] = useState(1250);
            
            // UI State
            const [view, setView] = useState('map'); // 'map' | 'sector' | 'boss-list' | 'boss-detail'
            const [activeSector, setActiveSector] = useState(null);
            const [activeBoss, setActiveBoss] = useState(null);
            
            // Drill/Combat State
            const [currentQuestions, setCurrentQuestions] = useState([]);
            const [questionIndex, setQuestionIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(45);
            const [diagnostic, setDiagnostic] = useState(null);

            // Sector Timer Logic
            useEffect(() => {
                let timer;
                if (view === 'sector' && !diagnostic && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (view === 'sector' && timeLeft === 0 && !diagnostic) {
                    handleTimeout();
                }
                return () => clearInterval(timer);
            }, [view, timeLeft, diagnostic]);

            const handleTimeout = () => {
                setHullHP(prev => Math.max(0, prev - 15));
                setDiagnostic({
                    type: 'error',
                    title: 'CRITICAL: Time Out Leak Detected',
                    message: 'Ship AI processing failed to reach a conclusion in time. ' + currentQuestions[questionIndex].diagnosticLeak
                });
            };

            // --- Navigation Handlers ---
            const openSector = (sectorName) => {
                // Fetch and randomize questions for the chosen sector
                const filtered = MISSIONS.filter(m => m.sector === sectorName);
                const shuffled = [...filtered].sort(() => Math.random() - 0.5);
                
                setCurrentQuestions(shuffled);
                setActiveSector(sectorName);
                setQuestionIndex(0);
                setTimeLeft(45);
                setDiagnostic(null);
                setView('sector');
            };

            const openBossList = () => setView('boss-list');
            
            const openBossDetail = (boss) => {
                setActiveBoss(boss);
                setView('boss-detail');
                setDiagnostic(null);
            };
            
            const closeModals = () => {
                setActiveSector(null);
                setActiveBoss(null);
                setView('map');
            };

            // --- Gameplay Handlers ---
            const handleAnswer = (selectedIndex) => {
                const currentQ = currentQuestions[questionIndex];
                const isCorrect = selectedIndex === currentQ.correctIndex;
                
                if (isCorrect) {
                    setHullHP(prev => Math.min(100, prev + 5));
                    setStardust(prev => prev + currentQ.stardustReward);
                    setDiagnostic({
                        type: 'success',
                        title: 'Telemetry Alert: Optimal Path Found',
                        message: `Brilliant maneuver! +${currentQ.stardustReward} Stardust acquired. Hull integrity restored by 5%. Tip: ${currentQ.repairTip}`
                    });
                } else {
                    setHullHP(prev => Math.max(0, prev - 15));
                    setDiagnostic({
                        type: 'error',
                        title: 'Ship AI Diagnostic: Conceptual Bug',
                        message: `${currentQ.diagnosticLeak} Tip: ${currentQ.repairTip}`
                    });
                }
            };

            const handleNext = () => {
                if (questionIndex < currentQuestions.length - 1) {
                    setQuestionIndex(prev => prev + 1);
                    setTimeLeft(45);
                    setDiagnostic(null);
                } else {
                    closeModals();
                }
            };

            const simulateBossFight = () => {
                // Simple RNG for Boss simulation outcome based on Stardust
                const successChance = stardust >= activeBoss.bossHp ? 0.8 : 0.3; 
                const won = Math.random() < successChance;
                
                if (won) {
                    setStardust(prev => prev + (activeBoss.bossHp * 2));
                    setDiagnostic({ type: 'success', title: 'VICTORY: Raid Successful', message: activeBoss.debriefSuccess });
                } else {
                    setHullHP(prev => Math.max(0, prev - 40));
                    setDiagnostic({ type: 'error', title: 'DEFEAT: Raid Failed', message: activeBoss.debriefFailure });
                }
            };

            return (
                <div className="relative w-screen h-screen flex flex-col items-center">
                    <div className="scanline"></div>
                    <div className="hud-grid"></div>

                    {/* --- HUD Top Bar --- */}
                    <header className="w-full max-w-6xl mt-4 px-6 py-4 flex justify-between items-center bg-slate-900/60 backdrop-blur-md neon-border-cyan rounded-lg z-10">
                        <div className="flex items-center space-x-6">
                            <div className="flex flex-col">
                                <span className="text-xs text-cyan-400 uppercase tracking-widest">Ship Hull HP</span>
                                <div className="flex items-center space-x-2 mt-1">
                                    <ShieldIcon />
                                    <div className="w-32 h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                        <div 
                                            className={`h-full transition-all duration-500 ${hullHP > 30 ? 'bg-cyan-500' : 'bg-red-500'}`} 
                                            style={{ width: `${hullHP}%` }}
                                        ></div>
                                    </div>
                                    <span className="font-bold text-lg">{hullHP}%</span>
                                </div>
                            </div>
                        </div>

                        <div className="text-center flex flex-col items-center">
                            <h1 className="text-2xl font-bold tracking-widest neon-text-cyan">ORBIT_PREP</h1>
                            <p className="text-xs text-indigo-300 mb-2">Space-Themed Placement Odyssey</p>
                            <button 
                                onClick={openBossList} 
                                className="flex items-center space-x-2 px-4 py-1.5 border border-red-500/60 bg-red-950/40 hover:bg-red-900/60 text-red-400 rounded-md text-xs uppercase tracking-widest transition-all shadow-[0_0_10px_rgba(239,68,68,0.2)] hover:shadow-[0_0_15px_rgba(239,68,68,0.6)] group"
                            >
                                <SkullIcon className="w-4 h-4 group-hover:animate-pulse" />
                                <span>Engage Boss Raids</span>
                            </button>
                        </div>

                        <div className="flex items-center space-x-8">
                            <div className="flex flex-col items-end">
                                <span className="text-xs text-indigo-400 uppercase tracking-widest">Warp Fuel</span>
                                <div className="flex items-center space-x-1 mt-1 text-indigo-300">
                                    <ZapIcon />
                                    <span className="font-bold text-lg">{streak} Days</span>
                                </div>
                            </div>
                            <div className="flex flex-col items-end">
                                <span className="text-xs text-yellow-500 uppercase tracking-widest">Stardust Balance</span>
                                <div className="flex items-center space-x-1 mt-1 text-yellow-400">
                                    <StarIcon />
                                    <span className="font-bold text-lg">{stardust}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* --- Main Nav Map (Only shows if view === 'map') --- */}
                    {view === 'map' && (
                        <main className="flex-1 w-full max-w-5xl mt-12 z-10 flex flex-col items-center animate-fade-in">
                            <h2 className="text-xl text-cyan-200 mb-8 uppercase tracking-widest flex items-center">
                                <CrosshairIcon className="w-6 h-6 mr-3 text-cyan-500" />
                                Select Jump Sector
                            </h2>

                            <div className="grid grid-cols-2 gap-8 w-full mb-8">
                                <div onClick={() => openSector('Quant Nebula')} className="sector-card neon-border-cyan p-6 bg-slate-900/40 rounded-xl relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-2 bg-cyan-900/50 text-xs rounded-bl-lg text-cyan-200 border-b border-l border-cyan-500">ACTIVE</div>
                                    <h3 className="text-2xl font-bold text-cyan-300 mb-2">Quant Nebula</h3>
                                    <p className="text-sm text-slate-400">Navigate the logic asteroid belts. Aptitude & Reasoning modules.</p>
                                </div>

                                <div onClick={() => openSector('DSA Deep Space')} className="sector-card neon-border-cyan p-6 bg-slate-900/40 rounded-xl relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-2 bg-cyan-900/50 text-xs rounded-bl-lg text-cyan-200 border-b border-l border-cyan-500">ACTIVE</div>
                                    <h3 className="text-2xl font-bold text-cyan-300 mb-2">DSA Deep Space</h3>
                                    <p className="text-sm text-slate-400">Algorithms & Data Structure void anomalies.</p>
                                </div>

                                <div onClick={() => openSector('Core CS Void')} className="sector-card neon-border-cyan p-6 bg-slate-900/40 rounded-xl relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-2 bg-cyan-900/50 text-xs rounded-bl-lg text-cyan-200 border-b border-l border-cyan-500">ACTIVE</div>
                                    <h3 className="text-2xl font-bold text-cyan-300 mb-2">Core CS Void</h3>
                                    <p className="text-sm text-slate-400">OS, DBMS, and Network relay maintenance.</p>
                                </div>

                                <div onClick={() => openSector('HR Orbit')} className="sector-card neon-border-cyan p-6 bg-slate-900/40 rounded-xl relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-2 bg-cyan-900/50 text-xs rounded-bl-lg text-cyan-200 border-b border-l border-cyan-500">ACTIVE</div>
                                    <h3 className="text-2xl font-bold text-cyan-300 mb-2">HR Orbit</h3>
                                    <p className="text-sm text-slate-400">Interpersonal comms and diplomacy scenarios.</p>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* --- Sector Drill Modal --- */}
                    {view === 'sector' && currentQuestions.length > 0 && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="bg-slate-950 neon-border-cyan w-full max-w-3xl rounded-xl shadow-2xl flex flex-col overflow-hidden">
                                <div className="bg-slate-900 border-b border-cyan-800 p-4 flex justify-between items-center">
                                    <div className="flex items-center space-x-3">
                                        <CrosshairIcon className="w-8 h-8 text-cyan-400" />
                                        <div>
                                            <h2 className="text-lg font-bold text-cyan-100">{activeSector}: Sector Drill {questionIndex + 1}/{currentQuestions.length}</h2>
                                            <p className="text-xs text-slate-400">{currentQuestions[questionIndex].title}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-2 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                                        <ClockIcon className={`w-5 h-5 ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-cyan-400'}`} />
                                        <span className={`font-mono text-xl ${timeLeft <= 10 ? 'text-red-400' : 'text-cyan-100'}`}>00:{timeLeft.toString().padStart(2, '0')}</span>
                                    </div>
                                </div>
                                <div className="w-full h-1 bg-slate-800">
                                    <div className={`h-full transition-all duration-1000 ${timeLeft <= 10 ? 'bg-red-500' : 'bg-cyan-500'}`} style={{ width: `${(timeLeft / 45) * 100}%` }}></div>
                                </div>
                                <div className="p-8 flex-1">
                                    {!diagnostic ? (
                                        <>
                                            <p className="text-xl mb-8 text-slate-200 leading-relaxed">{currentQuestions[questionIndex].question}</p>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {currentQuestions[questionIndex].options.map((opt, idx) => (
                                                    <button key={idx} onClick={() => handleAnswer(idx)} className="py-4 px-6 bg-slate-900 border border-slate-700 rounded text-left text-lg hover:border-cyan-500 hover:bg-cyan-900/30 transition-all flex items-center group">
                                                        <span className="w-8 h-8 rounded-full border border-slate-600 flex items-center justify-center mr-4 group-hover:border-cyan-400 group-hover:text-cyan-300">{String.fromCharCode(65 + idx)}</span>
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        </>
                                    ) : (
                                        <div className={`p-6 rounded-lg border ${diagnostic.type === 'success' ? 'bg-green-900/20 border-green-500/50' : 'bg-red-900/20 border-red-500/50'}`}>
                                            <div className="flex items-center space-x-3 mb-4">
                                                {diagnostic.type === 'success' ? <CheckIcon className="w-8 h-8 text-green-400" /> : <AlertIcon className="w-8 h-8 text-red-400" />}
                                                <h3 className={`text-2xl font-bold ${diagnostic.type === 'success' ? 'neon-text-green' : 'neon-text-red'}`}>{diagnostic.title}</h3>
                                            </div>
                                            <p className="text-lg text-slate-300 leading-relaxed mb-6">{diagnostic.message}</p>
                                            <div className="flex justify-between items-center border-t border-slate-700 pt-6 mt-4">
                                                <div className="flex items-center space-x-4">
                                                    {diagnostic.type === 'error' && <span className="text-red-400 font-bold bg-red-950 px-3 py-1 rounded border border-red-800">Hull HP -15%</span>}
                                                    {diagnostic.type === 'success' && (
                                                        <><span className="text-green-400 font-bold bg-green-950 px-3 py-1 rounded border border-green-800">Hull HP +5%</span>
                                                        <span className="text-yellow-400 font-bold bg-yellow-950 px-3 py-1 rounded border border-yellow-800">+{currentQuestions[questionIndex].stardustReward} Stardust</span></>
                                                    )}
                                                </div>
                                                <button onClick={handleNext} className="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded shadow-[0_0_15px_rgba(6,182,212,0.6)] transition-all">
                                                    {questionIndex < currentQuestions.length - 1 ? 'Initiate Next Jump' : 'Close Comms Link'}
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* --- Boss List Modal --- */}
                    {view === 'boss-list' && (
                         <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="bg-slate-950 neon-border-red w-full max-w-4xl max-h-[80vh] overflow-y-auto rounded-xl shadow-2xl flex flex-col p-8 relative">
                                <button onClick={closeModals} className="absolute top-4 right-6 text-slate-400 hover:text-white font-bold text-xl">X</button>
                                
                                <div className="text-center mb-10 border-b border-red-900/50 pb-6">
                                    <SkullIcon className="w-12 h-12 text-red-500 mx-auto mb-4 animate-pulse" />
                                    <h2 className="text-3xl font-bold neon-text-red uppercase tracking-widest">Atmospheric Re-entry Raids</h2>
                                    <p className="text-slate-400 mt-2">Select a corporate dreadnought to engage. Warning: High Hull damage potential.</p>
                                </div>
                                
                                <div className="grid grid-cols-1 gap-6">
                                    {BOSS_RAIDS.map((boss) => (
                                        <div key={boss.id} onClick={() => openBossDetail(boss)} className="boss-card p-6 bg-slate-900/60 border border-slate-700 rounded-lg flex justify-between items-center">
                                            <div>
                                                <div className="text-xs text-red-400 mb-1 tracking-widest uppercase">Clearance: {boss.clearanceLevel}</div>
                                                <h3 className="text-2xl font-bold text-white">{boss.bossName}</h3>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-sm text-slate-400">Target HP: <span className="text-red-400 font-bold">{boss.bossHp}</span></div>
                                                <div className="text-sm text-slate-400">Time Limit: <span className="text-cyan-400 font-bold">{boss.timeLimitSeconds}s</span></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* --- Boss Detail / Simulation Modal --- */}
                    {view === 'boss-detail' && activeBoss && (
                         <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
                            <div className="bg-slate-950 neon-border-red w-full max-w-3xl rounded-xl shadow-2xl flex flex-col">
                                <div className="bg-red-950/30 border-b border-red-900 p-6">
                                    <h2 className="text-2xl font-bold text-white mb-2">{activeBoss.bossName}</h2>
                                    <div className="flex space-x-4 text-sm text-slate-300">
                                        <span className="bg-slate-900 px-3 py-1 rounded border border-slate-700">Clearance: <span className="text-red-400">{activeBoss.clearanceLevel}</span></span>
                                        <span className="bg-slate-900 px-3 py-1 rounded border border-slate-700">Req. Power: <span className="text-yellow-400">{activeBoss.bossHp} SD</span></span>
                                    </div>
                                </div>
                                
                                <div className="p-8">
                                    {!diagnostic ? (
                                        <>
                                            <h3 className="text-xl text-cyan-300 mb-4 border-b border-cyan-900/50 pb-2">Combat Phases</h3>
                                            <div className="space-y-4 mb-8">
                                                {activeBoss.phaseRounds.map((phase, idx) => (
                                                    <div key={idx} className="bg-slate-900 p-4 rounded border border-slate-800">
                                                        <h4 className="font-bold text-red-300">{phase.roundName}</h4>
                                                        <p className="text-slate-400 text-sm mt-1">{phase.description}</p>
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            <div className="flex justify-between items-center border-t border-slate-800 pt-6">
                                                <button onClick={openBossList} className="text-slate-400 hover:text-white transition-colors">Abhort Mission</button>
                                                <button 
                                                    onClick={simulateBossFight}
                                                    className="px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded shadow-[0_0_15px_rgba(239,68,68,0.6)] uppercase tracking-widest transition-all"
                                                >
                                                    Engage Simulation
                                                </button>
                                            </div>
                                        </>
                                    ) : (
                                         <div className={`p-8 rounded-lg border ${diagnostic.type === 'success' ? 'bg-green-900/20 border-green-500/50' : 'bg-red-900/20 border-red-500/50'}`}>
                                            <div className="flex items-center space-x-3 mb-6">
                                                {diagnostic.type === 'success' ? <CheckIcon className="w-10 h-10 text-green-400" /> : <AlertIcon className="w-10 h-10 text-red-400" />}
                                                <h3 className={`text-3xl font-bold ${diagnostic.type === 'success' ? 'neon-text-green' : 'neon-text-red'}`}>{diagnostic.title}</h3>
                                            </div>
                                            <p className="text-xl text-slate-300 leading-relaxed mb-8">{diagnostic.message}</p>
                                            
                                            <div className="flex justify-between items-center border-t border-slate-700 pt-6">
                                                <div className="flex items-center space-x-4">
                                                    {diagnostic.type === 'error' && <span className="text-red-400 font-bold bg-red-950 px-4 py-2 rounded border border-red-800">Hull HP -40%</span>}
                                                    {diagnostic.type === 'success' && <span className="text-yellow-400 font-bold bg-yellow-950 px-4 py-2 rounded border border-yellow-800">Bounty: +{activeBoss.bossHp * 2} SD</span>}
                                                </div>
                                                <button onClick={closeModals} className="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded transition-all">Return to Map</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- Game Over Screen --- */}
                    {hullHP <= 0 && (
                        <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black/95">
                            <div className="text-center">
                                <AlertIcon className="w-24 h-24 mx-auto text-red-600 mb-6 animate-pulse" />
                                <h1 className="text-5xl font-bold neon-text-red mb-4">CRITICAL HULL FAILURE</h1>
                                <p className="text-xl text-slate-400 mb-8">Your ship has been compromised by logic leaks.</p>
                                <button onClick={() => window.location.reload()} className="px-8 py-4 border border-red-500 text-red-500 hover:bg-red-950 transition-colors rounded text-lg uppercase tracking-widest">
                                    Reboot Simulation
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
