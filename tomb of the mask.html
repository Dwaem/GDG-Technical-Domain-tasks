<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrbitPrep: Void Walker</title>
    <style>
        :root {
            --bg: #050814;
            --cyan: #00ffff;
            --purple: #bf00ff;
            --pink: #ff007f;
            --green: #00ffaa;
            --red: #ff003c;
            --gold: #ffdf00;
            --font: 'Courier New', Courier, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: var(--font);
            overflow: hidden; 
            touch-action: none;
        }
        canvas {
            display: block;
            margin: 0 auto;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            background: radial-gradient(circle at center, #0a1024 0%, var(--bg) 100%);
        }
        #ui-layer {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 600px; height: 100vh;
            pointer-events: none;
        }
        .hud {
            padding: 15px; display: flex; justify-content: space-between;
            font-size: 16px; font-weight: bold; text-shadow: 0 0 5px var(--cyan);
            background: linear-gradient(to bottom, rgba(5,8,20,0.9), transparent);
        }
        .hud-left { text-align: left; color: var(--cyan); }
        .hud-right { text-align: right; color: var(--green); }
        
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 20, 0.85); backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; opacity: 0; transition: opacity 0.3s; z-index: 10;
        }
        .modal-overlay.active { opacity: 1; }
        
        .modal-box {
            background: rgba(10, 16, 36, 0.95); border: 2px solid var(--cyan);
            padding: 25px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .modal-box h2 {
            margin-bottom: 20px; font-size: 18px; color: var(--pink);
            text-shadow: 0 0 8px var(--pink);
        }
        .btn {
            display: block; width: 100%; padding: 12px; margin: 10px 0;
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
            font-family: var(--font); font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase;
        }
        .btn:hover, .btn:active {
            background: var(--cyan); color: var(--bg); box-shadow: 0 0 15px var(--cyan);
        }
        
        #toast {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 14px; font-weight: bold; text-align: center;
            background: rgba(255,0,127,0.8); padding: 10px 20px; border-radius: 5px;
            opacity: 0; transition: opacity 0.2s; text-shadow: none; border: 1px solid var(--pink);
        }

        .crt-effect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
    <div class="crt-effect"></div>
    <div class="hud" id="hud" style="display:none;">
        <div class="hud-left">
            <div>SCORE: <span id="scoreVal">0</span></div>
            <div>FLOOR: <span id="floorVal">1</span></div>
        </div>
        <div class="hud-right">
            <div>SHIELDS: <span id="shieldVal">3</span></div>
            <div>STREAK: x<span id="streakVal">1</span></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div class="modal-overlay active" id="startScreen">
        <div class="modal-box">
            <h1 style="color: var(--cyan); font-size: 28px; text-shadow: 0 0 10px var(--cyan); margin-bottom: 10px;">ORBITPREP</h1>
            <h2 style="color: var(--purple); font-size: 20px; text-shadow: 0 0 10px var(--purple);">VOID WALKER</h2>
            <p style="font-size: 12px; margin-bottom: 20px; color: #aaa;">
                Swipe or Arrow Keys to Dash.<br>
                Collect Stardust. Hack Terminals.<br>
                Outrun the rising Void.
            </p>
            <button class="btn" onclick="initGame()">INITIALIZE SYSTEM</button>
        </div>
    </div>

    <!-- Quiz Terminal -->
    <div class="modal-overlay" id="quizModal" style="display:none;">
        <div class="modal-box">
            <div style="color: var(--green); margin-bottom:10px; font-weight:bold;">> DATA CORE TERMINAL ACCESSED</div>
            <h2 id="qText">Question?</h2>
            <div id="qOptions"></div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div class="modal-overlay" id="gameOverScreen" style="display:none;">
        <div class="modal-box">
            <h1 style="color: var(--red); font-size: 28px; text-shadow: 0 0 10px var(--red); margin-bottom: 10px;">SYSTEM FAILURE</h1>
            <p style="margin-bottom: 5px;">Final Score: <span id="goScore"></span></p>
            <p style="margin-bottom: 20px;">Max Floor: <span id="goFloor"></span></p>
            <button class="btn" onclick="initGame()">REBOOT</button>
        </div>
    </div>

    <div id="toast"></div>
</div>

<script>
/* ==========================================================================
   WEB AUDIO API SYNTHESIZER
   ========================================================================== */
const AudioSys = (function() {
    let ctx;
    return {
        init: function() {
            if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            if(ctx.state === 'suspended') ctx.resume();
        },
        play: function(type) {
            if(!ctx) return;
            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            switch(type) {
                case 'dash':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, t);
                    osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
                    gain.gain.setValueAtTime(0.05, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                    osc.start(t); osc.stop(t + 0.15);
                    break;
                case 'pickup':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, t);
                    osc.frequency.setValueAtTime(1200, t + 0.05);
                    gain.gain.setValueAtTime(0.05, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                    break;
                case 'terminal':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, t);
                    osc.frequency.linearRampToValueAtTime(600, t + 0.2);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.3);
                    osc.start(t); osc.stop(t + 0.3);
                    break;
                case 'correct':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, t);
                    osc.frequency.setValueAtTime(600, t + 0.1);
                    osc.frequency.setValueAtTime(800, t + 0.2);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.4);
                    osc.start(t); osc.stop(t + 0.4);
                    break;
                case 'error':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, t);
                    osc.frequency.linearRampToValueAtTime(100, t + 0.3);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.3);
                    osc.start(t); osc.stop(t + 0.3);
                    break;
                case 'die':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, t);
                    osc.frequency.exponentialRampToValueAtTime(10, t + 0.5);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                    osc.start(t); osc.stop(t + 0.5);
                    break;
            }
        }
    };
})();

/* ==========================================================================
   GAME ENGINE & LOGIC
   ========================================================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let cw = canvas.width = 440; 
let ch = canvas.height = 700;

// Grid Settings
const WIDTH = 11;
const HEIGHT = 500; 
const TILE_SIZE = 40;

// Game State
let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
let map = [];
let particles = [];
let trail = [];
let lastTime = 0;

let p = { x: 5, y: 1, vx: 0, vy: 0, tx: 5, ty: 1, moving: false };
const P_SPEED = 0.5; // Tiles per frame (fast dash)

let camY = 1;
let voidY = -10;
let voidSpeed = 0.025;
let voidFrozenTime = 0;

let stats = { score: 0, floor: 1, shields: 3, streak: 1 };
let currentQ = null;

// Placement Questions Database
const questions = [
    {q:"Which data structure uses LIFO?", opts:["Queue","Stack","Graph"], a:1, exp:"Stacks are Last-In-First-Out."},
    {q:"Time complexity of Binary Search?", opts:["O(1)","O(n)","O(log n)"], a:2, exp:"It halves the search space each step."},
    {q:"What is a JS Closure?", opts:["A locked file","A looping structure","Function + lexical scope"], a:2, exp:"Closures capture variables from their outer scope."},
    {q:"Worst-case time for QuickSort?", opts:["O(n log n)","O(n^2)","O(n)"], a:1, exp:"O(n^2) happens when the pivot is poorly chosen."},
    {q:"Which HTTP method is idempotent?", opts:["POST","PUT","PATCH"], a:1, exp:"PUT replaces the resource, repeated calls have same effect."},
    {q:"In Git, what creates and switches to a branch?", opts:["git branch -n","git checkout -b","git switch -c"], a:1, exp:"git checkout -b creates and checks out the branch."},
    {q:"SQL: Filter records AFTER grouping?", opts:["WHERE","HAVING","FILTER"], a:1, exp:"HAVING filters aggregated groups, WHERE filters rows."},
    {q:"React: Hook for side effects?", opts:["useState","useEffect","useContext"], a:1, exp:"useEffect handles side effects like data fetching."},
    {q:"Design Patterns: Restrict to single instance?", opts:["Singleton","Factory","Observer"], a:0, exp:"Singleton ensures only one instance exists."},
    {q:"Which graph traversal uses a Queue?", opts:["DFS","BFS","Dijkstra"], a:1, exp:"Breadth-First Search processes layer by layer using a Queue."}
];

function generateMaze() {
    map = Array.from({length: HEIGHT}, () => new Array(WIDTH).fill(1));
    let stack = [[5,1]];
    map[1][5] = 0;
    
    // DFS generation
    while(stack.length > 0) {
        let [x, y] = stack[stack.length - 1];
        let dirs = [];
        if(y + 2 < HEIGHT - 1 && map[y+2][x] === 1) dirs.push([0, 2], [0, 2], [0, 2]); // bias upward
        if(y - 2 > 0 && map[y-2][x] === 1) dirs.push([0, -2]);
        if(x + 2 < WIDTH - 1 && map[y][x+2] === 1) dirs.push([2, 0]);
        if(x - 2 > 0 && map[y][x-2] === 1) dirs.push([-2, 0]);

        if(dirs.length > 0) {
            let [dx, dy] = dirs[Math.floor(Math.random() * dirs.length)];
            map[y+dy/2][x+dx/2] = 0;
            map[y+dy][x+dx] = 0;
            stack.push([x+dx, y+dy]);
        } else {
            stack.pop();
        }
    }
    // Ensure bottom area is open
    map[0][5] = 0; map[2][5] = 0; map[1][4] = 0; map[1][6] = 0;

    // Create loops and populate entities
    for(let i=2; i<HEIGHT-2; i++) {
        for(let j=1; j<WIDTH-1; j++) {
            if(map[i][j] === 1) {
                let vSplit = map[i-1][j]===0 && map[i+1][j]===0 && map[i][j-1]===1 && map[i][j+1]===1;
                let hSplit = map[i][j-1]===0 && map[i][j+1]===0 && map[i-1][j]===1 && map[i+1][j]===1;
                if((vSplit || hSplit) && Math.random() < 0.2) map[i][j] = 0;
            }
        }
    }

    for(let i=2; i<HEIGHT-2; i++) {
        for(let j=1; j<WIDTH-1; j++) {
            if(map[i][j] === 0) {
                let r = Math.random();
                if(r < 0.02) map[i][j] = 4; // Core
                else if(r < 0.04) map[i][j] = 3; // Spike Hazard
                else if(r < 0.6) map[i][j] = 2; // Stardust
            }
        }
    }
}

function initGame() {
    AudioSys.init();
    generateMaze();
    p = { x: 5, y: 1, vx: 0, vy: 0, tx: 5, ty: 1, moving: false };
    camY = 1; voidY = -15; voidSpeed = 0.02; voidFrozenTime = 0;
    stats = { score: 0, floor: 1, shields: 3, streak: 1 };
    particles = []; trail = [];
    
    document.getElementById('startScreen').classList.remove('active');
    document.getElementById('gameOverScreen').style.display = 'none';
    setTimeout(() => document.getElementById('startScreen').style.display = 'none', 300);
    document.getElementById('hud').style.display = 'flex';
    
    updateHUD();
    gameState = 'PLAYING';
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function moveInput(dx, dy) {
    if(gameState !== 'PLAYING' || p.moving) return;
    
    let nx = p.x, ny = p.y;
    while(true) {
        let tx = nx + dx, ty = ny + dy;
        if(ty < 0 || ty >= HEIGHT || tx < 0 || tx >= WIDTH || map[ty][tx] === 1) break;
        nx = tx; ny = ty;
    }
    
    if(nx !== p.x || ny !== p.y) {
        p.tx = nx; p.ty = ny;
        // Normalize velocity
        p.vx = dx * P_SPEED; p.vy = dy * P_SPEED;
        p.moving = true;
        AudioSys.play('dash');
    }
}

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x + (Math.random()-0.5), y: y + (Math.random()-0.5),
            vx: (Math.random()-0.5)*0.2, vy: (Math.random()-0.5)*0.2,
            life: 1.0, color: color
        });
    }
}

function triggerTerminal() {
    gameState = 'PAUSED';
    AudioSys.play('terminal');
    currentQ = questions[Math.floor(Math.random() * questions.length)];
    
    document.getElementById('quizModal').style.display = 'flex';
    setTimeout(() => document.getElementById('quizModal').classList.add('active'), 10);
    
    document.getElementById('qText').innerText = currentQ.q;
    let optsHTML = '';
    currentQ.opts.forEach((opt, idx) => {
        optsHTML += `<button class="btn" onclick="answerQuiz(${idx})">${opt}</button>`;
    });
    document.getElementById('qOptions').innerHTML = optsHTML;
}

window.answerQuiz = function(idx) {
    document.getElementById('quizModal').classList.remove('active');
    setTimeout(() => document.getElementById('quizModal').style.display = 'none', 300);
    
    if(idx === currentQ.a) {
        AudioSys.play('correct');
        stats.score += 500 * stats.streak;
        stats.streak++;
        voidFrozenTime = 300; // 5 seconds (60fps * 5)
        showToast("CORRECT! Void Frozen.", "var(--green)");
    } else {
        AudioSys.play('error');
        stats.shields--;
        stats.streak = 1;
        voidY = Math.min(voidY, p.y - 12); // push void back slightly to give chance
        showToast(`ERROR: ${currentQ.exp}`, "var(--red)");
        if(stats.shields <= 0) {
            die(); return;
        }
    }
    updateHUD();
    gameState = 'PLAYING';
};

function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.backgroundColor = color || "var(--pink)";
    t.style.opacity = 1;
    setTimeout(() => t.style.opacity = 0, 2500);
}

function die() {
    gameState = 'GAMEOVER';
    AudioSys.play('die');
    spawnParticles(p.x, p.y, 'var(--red)', 50);
    document.getElementById('hud').style.display = 'none';
    
    document.getElementById('goScore').innerText = stats.score;
    document.getElementById('goFloor').innerText = stats.floor;
    
    const go = document.getElementById('gameOverScreen');
    go.style.display = 'flex';
    setTimeout(() => go.classList.add('active'), 10);
}

function updateHUD() {
    document.getElementById('scoreVal').innerText = stats.score;
    document.getElementById('floorVal').innerText = stats.floor;
    document.getElementById('shieldVal').innerText = stats.shields;
    document.getElementById('streakVal').innerText = stats.streak;
}

function getScreenY(worldY) {
    return ch * 0.7 - (worldY - camY) * TILE_SIZE;
}

function update(dt) {
    if(p.moving) {
        p.x += p.vx; p.y += p.vy;
        trail.push({x: p.x, y: p.y, life: 1.0});
        
        let cx = Math.round(p.x), cy = Math.round(p.y);
        stats.floor = Math.max(stats.floor, cy);
        updateHUD();

        // Item Collection
        if(map[cy] && map[cy][cx] !== undefined) {
            let item = map[cy][cx];
            if(item === 2) { // Stardust
                map[cy][cx] = 0;
                stats.score += 10 * stats.streak;
                AudioSys.play('pickup');
                spawnParticles(cx, cy, 'var(--gold)', 5);
                updateHUD();
            } else if(item === 3) { // Spike
                die(); return;
            } else if(item === 4) { // Core
                map[cy][cx] = 0;
                // Snap player to grid
                p.x = cx; p.y = cy; p.vx = 0; p.vy = 0; p.moving = false;
                triggerTerminal();
                return;
            }
        }

        // Target reached
        if( (p.vx > 0 && p.x >= p.tx) || (p.vx < 0 && p.x <= p.tx) ||
            (p.vy > 0 && p.y >= p.ty) || (p.vy < 0 && p.y <= p.ty) ) {
            p.x = p.tx; p.y = p.ty;
            p.vx = 0; p.vy = 0;
            p.moving = false;
        }
    }

    // Trail logic
    trail.forEach(t => t.life -= 0.1);
    trail = trail.filter(t => t.life > 0);

    // Camera smoothing
    camY += (p.y - camY) * 0.1;

    // Void logic
    if(voidFrozenTime > 0) {
        voidFrozenTime--;
    } else {
        voidSpeed += 0.00001; // Gets slightly faster over time
        voidY += voidSpeed;
    }
    
    if(p.y < voidY + 0.5) {
        die();
    }

    // Particles
    particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.03; });
    particles = particles.filter(pt => pt.life > 0);
}

function draw() {
    ctx.clearRect(0, 0, cw, ch);

    // Draw Map
    let startY = Math.max(0, Math.floor(camY - 15));
    let endY = Math.min(HEIGHT - 1, Math.floor(camY + 15));
    let offsetX = (cw - WIDTH * TILE_SIZE) / 2;

    for(let y = startY; y <= endY; y++) {
        for(let x = 0; x < WIDTH; x++) {
            let sx = offsetX + x * TILE_SIZE;
            let sy = getScreenY(y) - TILE_SIZE; // Top-left of tile
            
            if(map[y][x] === 1) { // Wall
                ctx.fillStyle = '#050a15';
                ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, TILE_SIZE, TILE_SIZE);
            } else if(map[y][x] === 2) { // Stardust
                ctx.fillStyle = 'var(--gold)';
                ctx.shadowBlur = 10; ctx.shadowColor = 'var(--gold)';
                ctx.beginPath(); ctx.arc(sx + 20, sy + 20, 3, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            } else if(map[y][x] === 3) { // Spike
                ctx.fillStyle = 'var(--red)';
                ctx.shadowBlur = 10; ctx.shadowColor = 'var(--red)';
                ctx.beginPath();
                ctx.moveTo(sx + 20, sy + 5);
                ctx.lineTo(sx + 5, sy + 35);
                ctx.lineTo(sx + 35, sy + 35);
                ctx.fill();
                ctx.shadowBlur = 0;
            } else if(map[y][x] === 4) { // Core
                ctx.fillStyle = 'var(--green)';
                ctx.shadowBlur = 15; ctx.shadowColor = 'var(--green)';
                let pulse = (Math.sin(Date.now() * 0.005) + 1) * 2;
                ctx.fillRect(sx + 10 - pulse, sy + 10 - pulse, 20 + pulse*2, 20 + pulse*2);
                ctx.shadowBlur = 0;
            }
        }
    }

    // Draw Trail
    if(trail.length > 0) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for(let i=0; i<trail.length; i++) {
            let sx = offsetX + trail[i].x * TILE_SIZE + 20;
            let sy = getScreenY(trail[i].y) - 20;
            if(i===0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
    }

    // Draw Player
    if(gameState !== 'GAMEOVER') {
        let px = offsetX + p.x * TILE_SIZE + 6;
        let py = getScreenY(p.y) - TILE_SIZE + 6;
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 15; ctx.shadowColor = 'var(--cyan)';
        ctx.fillRect(px, py, TILE_SIZE-12, TILE_SIZE-12);
        ctx.shadowBlur = 0;
    }

    // Draw Particles
    particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        let sx = offsetX + pt.x * TILE_SIZE + 20;
        let sy = getScreenY(pt.y) - 20;
        ctx.fillRect(sx, sy, 4, 4);
    });
    ctx.globalAlpha = 1.0;

    // Draw Void
    let vyScreen = getScreenY(voidY) - TILE_SIZE;
    ctx.fillStyle = 'rgba(191, 0, 255, 0.7)'; // purple transparent
    ctx.fillRect(0, vyScreen, cw, ch - vyScreen);
    // Void glowing edge
    ctx.fillStyle = voidFrozenTime > 0 ? 'var(--cyan)' : 'var(--pink)';
    ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(0, vyScreen - 5, cw, 10);
    ctx.shadowBlur = 0;
}

function gameLoop(time) {
    if(!lastTime) lastTime = time;
    let dt = time - lastTime;
    lastTime = time;

    if(gameState === 'PLAYING') update(dt);
    if(gameState !== 'START') draw();

    requestAnimationFrame(gameLoop);
}

/* ==========================================================================
   CONTROLS
   ========================================================================== */
window.addEventListener('keydown', e => {
    if(gameState !== 'PLAYING') return;
    switch(e.key) {
        case 'ArrowUp': case 'w': moveInput(0, 1); break;
        case 'ArrowDown': case 's': moveInput(0, -1); break;
        case 'ArrowLeft': case 'a': moveInput(-1, 0); break;
        case 'ArrowRight': case 'd': moveInput(1, 0); break;
    }
});

let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, {passive: false});

window.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

window.addEventListener('touchend', e => {
    if(gameState !== 'PLAYING') return;
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    
    if(Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if(Math.abs(dx) > Math.abs(dy)) {
            moveInput(dx > 0 ? 1 : -1, 0);
        } else {
            // Screen Y goes down, World Y goes up. 
            // Swipe Up (dy negative) -> Move World UP (dy positive)
            moveInput(0, dy < 0 ? 1 : -1);
        }
    }
});

// Initial draw behind start screen
draw();

</script>
</body>
