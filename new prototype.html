<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitPrep: Space-Themed Placement Odyssey</title>
    
    <!-- React 18 & Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles for Sci-Fi Theme -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body {
            background-color: #0b0c10; /* space-black */
            color: #cffafe; 
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* --- VISUAL OVERLAYS FROM PROTOTYPE --- */
        #soft-vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none;
            background: radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.95) 120%);
            z-index: 2;
        }

        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; z-index: 9999; pointer-events: none; mix-blend-mode: overlay;
        }
        
        #damage-vignette {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none;
            box-shadow: inset 0 0 150px rgba(255, 0, 0, 0); z-index: 9998;
            transition: box-shadow 0.3s ease;
        }
        #damage-vignette.active {
            box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.4);
            animation: pulseDamage 1.5s infinite alternate;
        }
        @keyframes pulseDamage {
            from { box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.3); }
            to { box-shadow: inset 0 0 200px rgba(255, 0, 0, 0.6); }
        }

        /* --- NEON & GLOW FX --- */
        .neon-border-cyan {
            border: 1px solid #06b6d4;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }
        .neon-border-red {
            border: 1px solid #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4), inset 0 0 10px rgba(239, 68, 68, 0.1);
        }
        .neon-text-cyan { text-shadow: 0 0 8px rgba(6, 182, 212, 0.8); }
        .neon-text-red { color: #fca5a5; text-shadow: 0 0 8px rgba(248, 113, 113, 0.8); }
        .neon-text-green { color: #86efac; text-shadow: 0 0 8px rgba(74, 222, 128, 0.8); }

        .scanline {
            width: 100%; height: 100px;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(6,182,212,0.1) 50%, rgba(0,0,0,0) 100%);
            position: absolute; bottom: 100%;
            animation: scanline 8s linear infinite; pointer-events: none; z-index: 1;
        }
        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: -100px; } }

        .hud-grid {
            background-image: linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0; opacity: 0.5;
        }

        /* --- FOCUS / CONTROLLER STYLES --- */
        .focused-element {
            transform: scale(1.05) !important;
            border-color: #66fcf1 !important;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.6), inset 0 0 15px rgba(102, 252, 241, 0.3) !important;
            background-color: rgba(30, 58, 138, 0.5) !important;
            z-index: 10;
        }
        .focused-element-red {
            transform: scale(1.05) !important;
            border-color: #ff2a2a !important;
            box-shadow: 0 0 25px rgba(255, 42, 42, 0.6), inset 0 0 15px rgba(255, 42, 42, 0.3) !important;
            background-color: rgba(127, 29, 29, 0.5) !important;
            z-index: 10;
        }

        .sector-card, .boss-card, .btn-option, .ui-btn { transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .sector-card:hover, .boss-card:hover { cursor: pointer; }
        
        #gamepad-status {
            display: none; background: rgba(102, 252, 241, 0.15); border: 1px solid #06b6d4;
            padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; color: #66fcf1;
            animation: pulseCyan 2s infinite alternate; letter-spacing: 1px;
        }
        @keyframes pulseCyan { from { box-shadow: 0 0 5px rgba(6, 182, 212, 0.2); } to { box-shadow: 0 0 15px rgba(6, 182, 212, 0.6); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Icons ---
        const ShieldIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
        const ZapIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
        const StarIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
        const ClockIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const AlertIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
        const CheckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const CrosshairIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>;
        const SkullIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><path d="M8 20v2h8v-2"></path><path d="m12.5 17-.5-1-.5 1h1z"></path><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"></path></svg>;
        const GamepadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2 inline"><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line><rect x="2" y="6" width="20" height="12" rx="2"></rect></svg>;

        // --- Data ---
        const SECTORS = [
            { id: 'quant', name: 'Quant Nebula', desc: 'Navigate the logic asteroid belts. Aptitude & Reasoning modules.' },
            { id: 'dsa', name: 'DSA Deep Space', desc: 'Algorithms & Data Structure void anomalies.' },
            { id: 'cs', name: 'Core CS Void', desc: 'OS, DBMS, and Network relay maintenance.' },
            { id: 'hr', name: 'HR Orbit', desc: 'Interpersonal comms and diplomacy scenarios.' }
        ];

        const MISSIONS = [
            { id: "CH-01", sector: "Quant Nebula", title: "Velocity Vector Anomaly", question: "A star cruiser travels from Alpha Station to Beta Station at 40 ly/hr and returns along the same route at 60 ly/hr. What is the average speed for the entire round trip?", options: ["48 ly/hr", "50 ly/hr", "52 ly/hr", "55 ly/hr"], correctIndex: 0, stardustReward: 50, diagnosticLeak: "Sensors detect a basic arithmetic leak! You calculated the simple average of speeds instead of accounting for the varied time spent at each velocity.", repairTip: "For equal distances, always calculate average speed using the formula: 2xy / (x + y)." },
            { id: "CH-02", sector: "Quant Nebula", title: "Reactor Ring Calibration", question: "How many distinct ways can 5 differently colored energy crystals be arranged in a circular reactor ring to stabilize the warp core?", options: ["120", "24", "60", "256"], correctIndex: 1, stardustReward: 50, diagnosticLeak: "Navigation array misaligned! Linear permutation rules were applied instead of accounting for the lack of a fixed starting point in a circular orbit.", repairTip: "For circular arrangements of n distinct items without a fixed reference point, use (n - 1)! to find total combinations." },
            { id: "CH-03", sector: "DSA Deep Space", title: "The Missing Node", question: "Given a continuous data stream array from 1 to N with exactly one missing packet (e.g., [1, 2, 4, 5]), which algorithm finds the missing node most optimally in O(N) time with O(1) space?", options: ["Bubble Sort and Check", "HashSet Lookup", "Gauss's Summation Formula", "Two-Pointer Traversal"], correctIndex: 2, stardustReward: 50, diagnosticLeak: "Memory leak imminent! Utilizing extra space sets or O(N^2) sorting algorithms exhausts the ship's computational resources unnecessarily.", repairTip: "Subtract the actual sum of the array from the expected mathematical sum of n(n+1)/2 to isolate the missing element instantly." },
            { id: "CH-04", sector: "DSA Deep Space", title: "Bisection Overflow", question: "When calculating the midpoint to binary search a massive sorted databank, which formula safely prevents integer overflow errors?", options: ["mid = (low + high) / 2", "mid = (high - low) / 2", "mid = low + (high - low) / 2", "mid = low * high / 2"], correctIndex: 2, stardustReward: 50, diagnosticLeak: "Buffer overflow detected in the matrix! Adding two massive 32-bit indices directly causes integer bounds to rupture and crash the search protocol.", repairTip: "Always use `low + (high - low) / 2` to safely calculate the midpoint without triggering maximum integer limits." },
            { id: "CH-05", sector: "Core CS Void", title: "Quantum Transaction Failure", question: "A warp engine fuel transaction fails midway due to a solar flare. Which database property guarantees the system rolls back to its original state rather than leaving corrupted, partial data?", options: ["Atomicity", "Consistency", "Isolation", "Durability"], correctIndex: 0, stardustReward: 50, diagnosticLeak: "Data corruption anomaly! You confused the guarantee of an 'all-or-nothing' execution phase with the long-term survival of data after saving.", repairTip: "Remember Atomicity as 'All or Nothing'—if a transaction breaks at any point, it aborts and rolls back entirely." },
            { id: "CH-06", sector: "Core CS Void", title: "System Gridlock", question: "Two AI threads are locked, each holding a resource the other needs. Which of the Coffman conditions is NOT a valid prerequisite for a deadlock?", options: ["Mutual Exclusion", "Hold and Wait", "Preemption", "Circular Wait"], correctIndex: 2, stardustReward: 50, diagnosticLeak: "System freeze protocol triggered! True deadlocks require *No* Preemption, meaning resources cannot be forcibly seized by the operating system.", repairTip: "Deadlocks require four exact pillars: Mutual Exclusion, Hold & Wait, NO Preemption, and Circular Wait." },
            { id: "CH-07", sector: "HR Orbit", title: "Chain of Command Conflict", question: "A senior co-pilot disagrees with your calculated flight path during a critical mission, despite your data proving it is optimal. How do you resolve this?", options: ["Override their manual controls to save the ship.", "Publicly challenge their logic over the global comms.", "Present data-backed telemetry privately to find consensus.", "Comply silently to maintain the chain of command."], correctIndex: 2, stardustReward: 50, diagnosticLeak: "Diplomatic failure! Escalating aggressively or surrendering your logic compromises both crew morale and the ultimate success of the mission.", repairTip: "Address conflicts objectively using data in a private setting, ensuring mutual respect while solving the root problem." },
            { id: "CH-08", sector: "HR Orbit", title: "The Admiral's Pitch", question: "The Fleet Admiral asks: 'Why should we recruit you over other cadets?' What is the most effective strategic response?", options: ["State confidently that you are the smartest cadet in your class.", "Align your specific engineering skills with the fleet's current technical challenges.", "Explain that you need the credits urgently to support your home colony.", "Summarize your entire life story and passion for space from childhood."], correctIndex: 1, stardustReward: 50, diagnosticLeak: "Signal lost in the noise! Focusing solely on generic praise or irrelevant personal history fails to demonstrate your tangible value to the fleet's objectives.", repairTip: "Map your unique skills and past projects directly to the company's stated pain points and future goals." }
        ];

        const BOSS_RAIDS = [
            { id: "B-01", bossName: "The Mass-Fleet Mothership (NQT Class)", clearanceLevel: "Cadet", bossHp: 300, timeLimitSeconds: 240, phaseRounds: [{ roundName: "Phase 1: Cognitive Firewall", description: "Speed-based Quants & Verbal logic. High-volume, low-complexity incoming data streams." }, { roundName: "Phase 2: Syntax Swarm", description: "Rapid-fire pseudo-code interpretation and basic C/C++/Java output prediction." }, { roundName: "Phase 3: Core Algorithm Patch", description: "Standard array and string manipulation to stabilize the Mothership's basic thrusters." }], debriefSuccess: "Telemetry confirmed. You have successfully bypassed the Mass-Fleet's entry filters and secured your place in the planetary armada.", debriefFailure: "Overwhelmed by the swarm. Your processing speed was insufficient for the Mass-Fleet's volume requirements. Upgrade your base computational speed and retry." },
            { id: "B-02", bossName: "The FinTech Dreadnought (GS/MS Class)", clearanceLevel: "Commander", bossHp: 500, timeLimitSeconds: 480, phaseRounds: [{ roundName: "Phase 1: Quant-Math Matrix", description: "Advanced Probability, Combinatorics, and Linear Algebra matrices to unlock the vault." }, { roundName: "Phase 2: Memory Leak Anomaly", description: "Deep dive into OS Deadlocks, Semaphore synchronization, and complex Pointer arithmetic." }, { roundName: "Phase 3: High-Frequency Asteroid Barrage", description: "Hard DSA utilizing Dynamic Programming and Graph traversals optimized for minimum latency." }], debriefSuccess: "Dreadnought breached. You have proven exceptional analytical fortitude and memory management. The financial trade sectors are yours.", debriefFailure: "Critical system crash. The Dreadnought's mathematical matrix and memory constraints exposed inefficiencies in your logic core. Recalibrate your DP and OS fundamentals." },
            { id: "B-03", bossName: "The Big-Tech Orbital Platform (AMZN/FLPK Class)", clearanceLevel: "Fleet Admiral", bossHp: 750, timeLimitSeconds: 600, phaseRounds: [{ roundName: "Phase 1: Data Structure Orbital Rings", description: "Medium-Hard DSA anomalies requiring advanced Trees, Hash Maps, and Heaps to realign." }, { roundName: "Phase 2: Edge-Case Solar Flares", description: "Hard algorithmic bottlenecks focusing on Sliding Windows and boundary condition stress tests." }, { roundName: "Phase 3: System Architecture Core", description: "Low-Level Design (LLD) simulation. Constructing scalable, Object-Oriented blueprints for the platform's new comms array." }], debriefSuccess: "Orbital Platform secured. Your structural architecture and algorithmic efficiency meet the highest galactic standards. Welcome to the Big-Tech upper echelon.", debriefFailure: "Structural integrity compromised. Your designs failed to scale under Big-Tech pressure and edge-case anomalies. Reinforce your Low-Level Design modules and Time Complexity optimization." }
        ];

        // --- Main App Component ---
        const App = () => {
            const [hullHP, setHullHP] = useState(100);
            const [streak, setStreak] = useState(14);
            const [stardust, setStardust] = useState(1250);
            
            const [view, setView] = useState('map'); 
            const [activeSector, setActiveSector] = useState(null);
            const [activeBoss, setActiveBoss] = useState(null);
            
            const [currentQuestions, setCurrentQuestions] = useState([]);
            const [questionIndex, setQuestionIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(45);
            const [diagnostic, setDiagnostic] = useState(null);
            
            // Controller & Navigation State
            const [cursorIdx, setCursorIdx] = useState(0);
            const [gpActive, setGpActive] = useState(false);
            const lastInputTime = useRef(0);
            const buttonState = useRef({ a: false, b: false, x: false, y: false });

            // --- Unified Input System (Keyboard + Gamepad) ---
            const handleInput = useCallback((dir, action) => {
                const now = Date.now();
                if (now - lastInputTime.current < 150) return; // Cooldown
                
                if (dir) {
                    lastInputTime.current = now;
                    setCursorIdx(prev => {
                        let next = prev;
                        if (view === 'map' || (view === 'sector' && !diagnostic)) {
                            // 2x2 Grid logic
                            if (dir === 'RIGHT') next = (prev % 2 === 0) ? prev + 1 : prev;
                            if (dir === 'LEFT') next = (prev % 2 !== 0) ? prev - 1 : prev;
                            if (dir === 'DOWN') next = (prev < 2) ? prev + 2 : prev;
                            if (dir === 'UP') next = (prev >= 2) ? prev - 2 : prev;
                        } else if (view === 'boss-list') {
                            // Vertical List logic
                            if (dir === 'DOWN') next = Math.min(prev + 1, BOSS_RAIDS.length - 1);
                            if (dir === 'UP') next = Math.max(prev - 1, 0);
                        }
                        return next;
                    });
                }

                if (action) {
                    lastInputTime.current = now;
                    if (action === 'SELECT' || action === 'A') {
                        if (view === 'map') {
                            if (cursorIdx === 4) openBossList(); // Assuming index 4 is the boss button
                            else openSector(SECTORS[cursorIdx].name);
                        } else if (view === 'boss-list') {
                            openBossDetail(BOSS_RAIDS[cursorIdx]);
                        } else if (view === 'boss-detail') {
                            if (!diagnostic) simulateBossFight(BOSS_RAIDS[cursorIdx]);
                            else closeModals();
                        } else if (view === 'sector') {
                            if (!diagnostic) handleAnswer(cursorIdx);
                            else handleNext();
                        }
                    } else if (action === 'BACK' || action === 'B') {
                        if (view !== 'map') closeModals();
                    } else if (action === 'X' || action === 'Y') {
                        // Direct option mappings inside question modal
                        if (view === 'sector' && !diagnostic) {
                            if (action === 'X') handleAnswer(2);
                            if (action === 'Y') handleAnswer(3);
                        }
                    }
                }
            }, [view, cursorIdx, diagnostic]);

            // Keyboard Hook
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const k = e.key.toLowerCase();
                    if (['w', 'arrowup'].includes(k)) handleInput('UP', null);
                    if (['s', 'arrowdown'].includes(k)) handleInput('DOWN', null);
                    if (['a', 'arrowleft'].includes(k)) handleInput('LEFT', null);
                    if (['d', 'arrowright'].includes(k)) handleInput('RIGHT', null);
                    if (['enter', ' '].includes(k)) handleInput(null, 'SELECT');
                    if (['escape', 'backspace'].includes(k)) handleInput(null, 'BACK');
                    
                    // Direct number keys for options
                    if (view === 'sector' && !diagnostic) {
                        if (k === '1') { setCursorIdx(0); handleInput(null, 'SELECT'); }
                        if (k === '2') { setCursorIdx(1); handleInput(null, 'SELECT'); }
                        if (k === '3') { setCursorIdx(2); handleInput(null, 'SELECT'); }
                        if (k === '4') { setCursorIdx(3); handleInput(null, 'SELECT'); }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleInput, view, diagnostic]);

            // Gamepad Loop Hook
            useEffect(() => {
                let raf;
                const pollGamepad = () => {
                    const gp = navigator.getGamepads()[0];
                    if (gp && gp.connected) {
                        if (!gpActive) setGpActive(true);
                        
                        // Axes for D-Pad / Stick
                        const axesY = gp.axes[1];
                        const axesX = gp.axes[0];
                        if (axesY < -0.5 || gp.buttons[12]?.pressed) handleInput('UP', null);
                        if (axesY > 0.5 || gp.buttons[13]?.pressed) handleInput('DOWN', null);
                        if (axesX < -0.5 || gp.buttons[14]?.pressed) handleInput('LEFT', null);
                        if (axesX > 0.5 || gp.buttons[15]?.pressed) handleInput('RIGHT', null);

                        // Buttons
                        if (gp.buttons[0]?.pressed && !buttonState.current.a) handleInput(null, 'A');
                        buttonState.current.a = gp.buttons[0]?.pressed;

                        if (gp.buttons[1]?.pressed && !buttonState.current.b) handleInput(null, 'B');
                        buttonState.current.b = gp.buttons[1]?.pressed;

                        if (gp.buttons[2]?.pressed && !buttonState.current.x) handleInput(null, 'X');
                        buttonState.current.x = gp.buttons[2]?.pressed;

                        if (gp.buttons[3]?.pressed && !buttonState.current.y) handleInput(null, 'Y');
                        buttonState.current.y = gp.buttons[3]?.pressed;
                    } else if (gpActive) {
                        setGpActive(false);
                    }
                    raf = requestAnimationFrame(pollGamepad);
                };
                raf = requestAnimationFrame(pollGamepad);
                return () => cancelAnimationFrame(raf);
            }, [handleInput, gpActive]);

            // Sector Timer Logic
            useEffect(() => {
                let timer;
                if (view === 'sector' && !diagnostic && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (view === 'sector' && timeLeft === 0 && !diagnostic) {
                    handleTimeout();
                }
                return () => clearInterval(timer);
            }, [view, timeLeft, diagnostic]);

            const handleTimeout = () => {
                setHullHP(prev => Math.max(0, prev - 15));
                setDiagnostic({
                    type: 'error', title: 'CRITICAL: Time Out Leak Detected',
                    message: 'Ship AI processing failed to reach a conclusion in time. ' + currentQuestions[questionIndex].diagnosticLeak
                });
            };

            const openSector = (sectorName) => {
                const filtered = MISSIONS.filter(m => m.sector === sectorName);
                const shuffled = [...filtered].sort(() => Math.random() - 0.5);
                setCurrentQuestions(shuffled);
                setActiveSector(sectorName);
                setQuestionIndex(0);
                setTimeLeft(45);
                setDiagnostic(null);
                setCursorIdx(0);
                setView('sector');
            };

            const openBossList = () => { setCursorIdx(0); setView('boss-list'); };
            
            const openBossDetail = (boss) => { setActiveBoss(boss); setCursorIdx(0); setView('boss-detail'); setDiagnostic(null); };
            
            const closeModals = () => { setActiveSector(null); setActiveBoss(null); setCursorIdx(0); setView('map'); };

            const handleAnswer = (selectedIndex) => {
                const currentQ = currentQuestions[questionIndex];
                const isCorrect = selectedIndex === currentQ.correctIndex;
                if (isCorrect) {
                    setHullHP(prev => Math.min(100, prev + 5));
                    setStardust(prev => prev + currentQ.stardustReward);
                    setDiagnostic({ type: 'success', title: 'Telemetry Alert: Optimal Path Found', message: `Brilliant maneuver! +${currentQ.stardustReward} Stardust acquired. Hull integrity restored by 5%. Tip: ${currentQ.repairTip}` });
                } else {
                    setHullHP(prev => Math.max(0, prev - 15));
                    setDiagnostic({ type: 'error', title: 'Ship AI Diagnostic: Conceptual Bug', message: `${currentQ.diagnosticLeak} Tip: ${currentQ.repairTip}` });
                }
            };

            const handleNext = () => {
                if (questionIndex < currentQuestions.length - 1) {
                    setQuestionIndex(prev => prev + 1);
                    setTimeLeft(45); setDiagnostic(null); setCursorIdx(0);
                } else {
                    closeModals();
                }
            };

            const simulateBossFight = (boss) => {
                const targetBoss = boss || activeBoss;
                const successChance = stardust >= targetBoss.bossHp ? 0.8 : 0.3; 
                const won = Math.random() < successChance;
                
                if (won) {
                    setStardust(prev => prev + (targetBoss.bossHp * 2));
                    setDiagnostic({ type: 'success', title: 'VICTORY: Raid Successful', message: targetBoss.debriefSuccess });
                } else {
                    setHullHP(prev => Math.max(0, prev - 40));
                    setDiagnostic({ type: 'error', title: 'DEFEAT: Raid Failed', message: targetBoss.debriefFailure });
                }
            };

            return (
                <div className="relative w-screen h-screen flex flex-col items-center">
                    <div id="soft-vignette"></div>
                    <div className="crt-overlay"></div>
                    <div className="scanline"></div>
                    <div className="hud-grid"></div>
                    
                    <div id="damage-vignette" className={hullHP <= 40 ? 'active' : ''}></div>

                    {/* --- HUD Top Bar --- */}
                    <header className="w-full max-w-6xl mt-4 px-6 py-4 flex justify-between items-center bg-slate-900/60 backdrop-blur-md neon-border-cyan rounded-lg z-20">
                        <div className="flex items-center space-x-6">
                            <div className="flex flex-col">
                                <span className="text-xs text-cyan-400 uppercase tracking-widest">Ship Hull HP</span>
                                <div className="flex items-center space-x-2 mt-1">
                                    <ShieldIcon />
                                    <div className="w-32 h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                        <div className={`h-full transition-all duration-500 ${hullHP > 30 ? 'bg-cyan-500' : 'bg-red-500'}`} style={{ width: `${hullHP}%` }}></div>
                                    </div>
                                    <span className="font-bold text-lg">{hullHP}%</span>
                                </div>
                            </div>
                        </div>

                        <div className="text-center flex flex-col items-center">
                            <h1 className="text-2xl font-bold tracking-widest neon-text-cyan">ORBIT_PREP</h1>
                            <p className="text-xs text-indigo-300 mb-2">Space-Themed Placement Odyssey</p>
                            <div id="gamepad-status" style={{ display: gpActive ? 'block' : 'none' }}>
                                <GamepadIcon /> Controller Active
                            </div>
                        </div>

                        <div className="flex items-center space-x-8">
                            <div className="flex flex-col items-end">
                                <span className="text-xs text-indigo-400 uppercase tracking-widest">Warp Fuel</span>
                                <div className="flex items-center space-x-1 mt-1 text-indigo-300">
                                    <ZapIcon />
                                    <span className="font-bold text-lg">{streak} Days</span>
                                </div>
                            </div>
                            <div className="flex flex-col items-end">
                                <span className="text-xs text-yellow-500 uppercase tracking-widest">Stardust Balance</span>
                                <div className="flex items-center space-x-1 mt-1 text-yellow-400">
                                    <StarIcon />
                                    <span className="font-bold text-lg">{stardust}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* --- Main Nav Map --- */}
                    {view === 'map' && (
                        <main className="flex-1 w-full max-w-5xl mt-12 z-20 flex flex-col items-center animate-fade-in">
                            <h2 className="text-xl text-cyan-200 mb-8 uppercase tracking-widest flex items-center">
                                <CrosshairIcon className="w-6 h-6 mr-3 text-cyan-500" />
                                Select Jump Sector <span className="ml-2 text-xs text-slate-400 bg-slate-900 px-2 py-1 rounded border border-slate-700">WASD to Move, SPACE/A to Engage</span>
                            </h2>

                            <div className="grid grid-cols-2 gap-8 w-full mb-8">
                                {SECTORS.map((sec, idx) => (
                                    <div 
                                        key={sec.id}
                                        onMouseEnter={() => setCursorIdx(idx)}
                                        onClick={() => openSector(sec.name)} 
                                        className={`sector-card p-6 bg-slate-900/40 rounded-xl relative overflow-hidden ${cursorIdx === idx ? 'focused-element' : 'neon-border-cyan'}`}
                                    >
                                        <div className="absolute top-0 right-0 p-2 bg-cyan-900/50 text-xs rounded-bl-lg text-cyan-200 border-b border-l border-cyan-500">ACTIVE</div>
                                        <h3 className="text-2xl font-bold text-cyan-300 mb-2">{sec.name}</h3>
                                        <p className="text-sm text-slate-400">{sec.desc}</p>
                                    </div>
                                ))}
                            </div>
                            
                            <button 
                                onMouseEnter={() => setCursorIdx(4)}
                                onClick={openBossList}
                                className={`ui-btn w-full max-w-md py-4 bg-red-950/40 border rounded-xl flex items-center justify-center space-x-4 transition-all group ${cursorIdx === 4 ? 'focused-element-red' : 'border-red-500/50 hover:bg-red-900/60 neon-text-red'}`}
                            >
                                <SkullIcon className={`w-8 h-8 text-red-500 ${cursorIdx === 4 ? 'animate-pulse' : 'group-hover:animate-pulse'}`} />
                                <span className="text-2xl font-bold uppercase tracking-widest text-red-400">Atmospheric Re-entry Boss Raids</span>
                            </button>
                        </main>
                    )}

                    {/* --- Sector Drill Modal --- */}
                    {view === 'sector' && currentQuestions.length > 0 && (
                        <div className="absolute inset-0 z-30 flex items-center justify-center bg-black/70 backdrop-blur-md p-4">
                            <div className="bg-slate-950 neon-border-cyan w-full max-w-3xl rounded-xl shadow-[0_0_50px_rgba(6,182,212,0.2)] flex flex-col overflow-hidden relative">
                                <div className="bg-slate-900 border-b border-cyan-800 p-4 flex justify-between items-center">
                                    <div className="flex items-center space-x-3">
                                        <CrosshairIcon className="w-8 h-8 text-cyan-400" />
                                        <div>
                                            <h2 className="text-lg font-bold text-cyan-100">{activeSector}: Sector Drill {questionIndex + 1}/{currentQuestions.length}</h2>
                                            <p className="text-xs text-slate-400">{currentQuestions[questionIndex].title}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-2 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                                        <ClockIcon className={`w-5 h-5 ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-cyan-400'}`} />
                                        <span className={`font-mono text-xl ${timeLeft <= 10 ? 'text-red-400' : 'text-cyan-100'}`}>00:{timeLeft.toString().padStart(2, '0')}</span>
                                    </div>
                                </div>
                                <div className="w-full h-1 bg-slate-800">
                                    <div className={`h-full transition-all duration-1000 ${timeLeft <= 10 ? 'bg-red-500' : 'bg-cyan-500'}`} style={{ width: `${(timeLeft / 45) * 100}%` }}></div>
                                </div>
                                <div className="p-8 flex-1">
                                    {!diagnostic ? (
                                        <>
                                            <p className="text-xl mb-8 text-slate-200 leading-relaxed">{currentQuestions[questionIndex].question}</p>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {currentQuestions[questionIndex].options.map((opt, idx) => {
                                                    const gpHints = ["[A/1]", "[B/2]", "[X/3]", "[Y/4]"];
                                                    return (
                                                    <button 
                                                        key={idx} 
                                                        onMouseEnter={() => setCursorIdx(idx)}
                                                        onClick={() => handleAnswer(idx)} 
                                                        className={`btn-option py-4 px-6 bg-slate-900 border rounded text-left text-lg transition-all flex items-center group ${cursorIdx === idx ? 'focused-element' : 'border-slate-700 hover:border-cyan-500 hover:bg-cyan-900/30'}`}
                                                    >
                                                        <span className={`w-10 h-8 rounded border flex items-center justify-center mr-4 text-xs font-bold ${cursorIdx === idx ? 'border-cyan-400 text-cyan-300' : 'border-slate-600'}`}>{gpHints[idx]}</span>
                                                        {opt}
                                                    </button>
                                                )})}
                                            </div>
                                            <div className="mt-6 text-center text-slate-500 text-sm">Abort [B / ESC]</div>
                                        </>
                                    ) : (
                                        <div className={`p-6 rounded-lg border ${diagnostic.type === 'success' ? 'bg-green-900/20 border-green-500/50' : 'bg-red-900/20 border-red-500/50'}`}>
                                            <div className="flex items-center space-x-3 mb-4">
                                                {diagnostic.type === 'success' ? <CheckIcon className="w-8 h-8 text-green-400" /> : <AlertIcon className="w-8 h-8 text-red-400" />}
                                                <h3 className={`text-2xl font-bold ${diagnostic.type === 'success' ? 'neon-text-green' : 'neon-text-red'}`}>{diagnostic.title}</h3>
                                            </div>
                                            <p className="text-lg text-slate-300 leading-relaxed mb-6">{diagnostic.message}</p>
                                            <div className="flex justify-between items-center border-t border-slate-700 pt-6 mt-4">
                                                <div className="flex items-center space-x-4">
                                                    {diagnostic.type === 'error' && <span className="text-red-400 font-bold bg-red-950 px-3 py-1 rounded border border-red-800">Hull HP -15%</span>}
                                                    {diagnostic.type === 'success' && (
                                                        <><span className="text-green-400 font-bold bg-green-950 px-3 py-1 rounded border border-green-800">Hull HP +5%</span>
                                                        <span className="text-yellow-400 font-bold bg-yellow-950 px-3 py-1 rounded border border-yellow-800">+{currentQuestions[questionIndex].stardustReward} Stardust</span></>
                                                    )}
                                                </div>
                                                <button 
                                                    onClick={handleNext} 
                                                    className="focused-element px-6 py-3 text-white font-bold rounded shadow-[0_0_15px_rgba(6,182,212,0.6)] transition-all flex items-center space-x-2"
                                                >
                                                    <span>{questionIndex < currentQuestions.length - 1 ? 'Initiate Next Jump' : 'Close Comms Link'}</span>
                                                    <span className="bg-black/30 px-2 py-0.5 rounded text-sm">[SPACE/A]</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* --- Boss List Modal --- */}
                    {view === 'boss-list' && (
                         <div className="absolute inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
                            <div className="bg-slate-950 neon-border-red w-full max-w-4xl max-h-[80vh] overflow-y-auto rounded-xl shadow-[0_0_50px_rgba(255,42,42,0.2)] flex flex-col p-8 relative">
                                <button onClick={closeModals} className="absolute top-4 right-6 text-slate-400 hover:text-white font-bold text-xl">X [B]</button>
                                
                                <div className="text-center mb-10 border-b border-red-900/50 pb-6">
                                    <SkullIcon className="w-12 h-12 text-red-500 mx-auto mb-4 animate-pulse" />
                                    <h2 className="text-3xl font-bold neon-text-red uppercase tracking-widest">Atmospheric Re-entry Raids</h2>
                                    <p className="text-slate-400 mt-2">Select a corporate dreadnought to engage. Warning: High Hull damage potential.</p>
                                </div>
                                
                                <div className="grid grid-cols-1 gap-6">
                                    {BOSS_RAIDS.map((boss, idx) => (
                                        <div 
                                            key={boss.id} 
                                            onMouseEnter={() => setCursorIdx(idx)}
                                            onClick={() => openBossDetail(boss)} 
                                            className={`boss-card p-6 border rounded-lg flex justify-between items-center ${cursorIdx === idx ? 'focused-element-red' : 'bg-slate-900/60 border-slate-700'}`}
                                        >
                                            <div>
                                                <div className="text-xs text-red-400 mb-1 tracking-widest uppercase">Clearance: {boss.clearanceLevel}</div>
                                                <h3 className="text-2xl font-bold text-white">{boss.bossName}</h3>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-sm text-slate-400">Target HP: <span className="text-red-400 font-bold">{boss.bossHp}</span></div>
                                                <div className="text-sm text-slate-400">Time Limit: <span className="text-cyan-400 font-bold">{boss.timeLimitSeconds}s</span></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* --- Boss Detail / Simulation Modal --- */}
                    {view === 'boss-detail' && activeBoss && (
                         <div className="absolute inset-0 z-30 flex items-center justify-center bg-black/90 backdrop-blur-lg p-4">
                            <div className="bg-slate-950 neon-border-red w-full max-w-3xl rounded-xl shadow-[0_0_50px_rgba(255,42,42,0.3)] flex flex-col">
                                <div className="bg-red-950/30 border-b border-red-900 p-6">
                                    <h2 className="text-2xl font-bold text-white mb-2">{activeBoss.bossName}</h2>
                                    <div className="flex space-x-4 text-sm text-slate-300">
                                        <span className="bg-slate-900 px-3 py-1 rounded border border-slate-700">Clearance: <span className="text-red-400">{activeBoss.clearanceLevel}</span></span>
                                        <span className="bg-slate-900 px-3 py-1 rounded border border-slate-700">Req. Power: <span className="text-yellow-400">{activeBoss.bossHp} SD</span></span>
                                    </div>
                                </div>
                                
                                <div className="p-8">
                                    {!diagnostic ? (
                                        <>
                                            <h3 className="text-xl text-cyan-300 mb-4 border-b border-cyan-900/50 pb-2">Combat Phases</h3>
                                            <div className="space-y-4 mb-8">
                                                {activeBoss.phaseRounds.map((phase, idx) => (
                                                    <div key={idx} className="bg-slate-900 p-4 rounded border border-slate-800">
                                                        <h4 className="font-bold text-red-300">{phase.roundName}</h4>
                                                        <p className="text-slate-400 text-sm mt-1">{phase.description}</p>
                                                    </div>
                                                ))}
                                            </div>
                                            
                                            <div className="flex justify-between items-center border-t border-slate-800 pt-6">
                                                <button onClick={closeModals} className="text-slate-400 hover:text-white transition-colors">Abort Mission [B]</button>
                                                <button 
                                                    onClick={() => simulateBossFight()}
                                                    className="focused-element-red px-8 py-3 text-white font-bold rounded shadow-[0_0_15px_rgba(239,68,68,0.6)] uppercase tracking-widest transition-all"
                                                >
                                                    Engage Simulation [SPACE/A]
                                                </button>
                                            </div>
                                        </>
                                    ) : (
                                         <div className={`p-8 rounded-lg border ${diagnostic.type === 'success' ? 'bg-green-900/20 border-green-500/50' : 'bg-red-900/20 border-red-500/50'}`}>
                                            <div className="flex items-center space-x-3 mb-6">
                                                {diagnostic.type === 'success' ? <CheckIcon className="w-10 h-10 text-green-400" /> : <AlertIcon className="w-10 h-10 text-red-400" />}
                                                <h3 className={`text-3xl font-bold ${diagnostic.type === 'success' ? 'neon-text-green' : 'neon-text-red'}`}>{diagnostic.title}</h3>
                                            </div>
                                            <p className="text-xl text-slate-300 leading-relaxed mb-8">{diagnostic.message}</p>
                                            
                                            <div className="flex justify-between items-center border-t border-slate-700 pt-6">
                                                <div className="flex items-center space-x-4">
                                                    {diagnostic.type === 'error' && <span className="text-red-400 font-bold bg-red-950 px-4 py-2 rounded border border-red-800">Hull HP -40%</span>}
                                                    {diagnostic.type === 'success' && <span className="text-yellow-400 font-bold bg-yellow-950 px-4 py-2 rounded border border-yellow-800">Bounty: +{activeBoss.bossHp * 2} SD</span>}
                                                </div>
                                                <button onClick={closeModals} className="focused-element px-6 py-3 text-white font-bold rounded transition-all">Return to Map [A/B]</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- Game Over Screen --- */}
                    {hullHP <= 0 && (
                        <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black/95">
                            <div className="text-center">
                                <AlertIcon className="w-24 h-24 mx-auto text-red-600 mb-6 animate-pulse" />
                                <h1 className="text-5xl font-bold neon-text-red mb-4">CRITICAL HULL FAILURE</h1>
                                <p className="text-xl text-slate-400 mb-8">Your ship has been compromised by logic leaks.</p>
                                <button onClick={() => window.location.reload()} className="focused-element-red px-8 py-4 border border-red-500 text-red-500 transition-colors rounded text-lg uppercase tracking-widest">
                                    Reboot Simulation [SPACE/A]
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
